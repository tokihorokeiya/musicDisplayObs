<div class="widget-card" id="widget-card">
                <div class="shizuru-petals">
                    <span class="petal p1">🌸</span>
                    <span class="petal p2">💮</span>
                    <span class="petal p3">🌸</span>
                    <span class="petal p4">💜</span>
                </div>
                <div class="shizuru-main-row">
                    <div class="pocket-watch-wrapper">
                        <div class="pocket-watch-crown">
                            <div class="pocket-watch-ring"></div>
                            <div class="ribbon-bow">
                                <div class="ribbon-knot"></div>
                                <div class="ribbon-tail left"></div>
                                <div class="ribbon-tail right"></div>
                            </div>
                        </div>
                        <div class="pocket-watch-case">
                            <div class="celestial-orbit-ring"></div>
                            <div class="pocket-watch-dial">
                                <span class="numeral n-xii">XII</span>
                                <span class="numeral n-iii">III</span>
                                <span class="numeral n-vi">VI</span>
                                <span class="numeral n-ix">IX</span>
                                <img class="cover-art" id="cover-img" src="${DEFAULT_COVER}" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="info-box">
                        <div class="shizuru-header">
                            <span class="shizuru-badge">✦ ASTRONOMICAL TIMEPIECE ✦</span>
                            <span class="shizuru-sub">CHRONO & SAKURA // CELESTIAL DIAL</span>
                        </div>
                        <div class="marquee-wrapper" id="title-wrapper">
                            <div class="marquee-content track-title" id="track-title">Waiting for music...</div>
                        </div>
                        <div class="artist-name" id="artist-name">No active playback</div>
                        <div class="progress-section">
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" id="progress-fill">
                                    <span class="celestial-star-tip">✧</span>
                                </div>
                            </div>
                            <div class="time-display" id="time-display">00:00 / 00:00</div>
                        </div>
                    </div>
                    <div class="shizuru-status-col">
                        <div class="sound-bars">
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            </div>
